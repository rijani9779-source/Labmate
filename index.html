<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabMate - Sistem Informasi Jadwal & Peminjaman Laboratorium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* Frame Mobile Persis Rasio Figma (412 x 860) */
    .phone-frame {
      width: 100%;
      max-width: 412px;
      height: 850px;
      background: #ffffff;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      position: relative;
      border: 6px solid #1e293b;
    }

    :root {
      --navy: #16365D;
      --sky: #55A6EB;
      --sky-hover: #4293d8;
      --gray-box: #D9D9D9;
      --red-btn: #FF0000;
      --green-dot: #38E516;
      --orange-dot: #E59B50;
    }

    .btn-sky {
      background: var(--sky);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 14px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      transition: 0.18s ease;
      letter-spacing: 0.2px;
    }
    .btn-sky:hover { background: var(--sky-hover); }

    .btn-red {
      background: var(--red-btn);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 14px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
    }

    /* Layar Auth */
    .auth-screen {
      flex: 1;
      background: var(--navy);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
    }
    .auth-brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .auth-brand-row h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .auth-card {
      background: #ffffff;
      color: #111827;
      width: 100%;
      border-radius: 26px;
      padding: 32px 24px 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    .auth-card h2 {
      text-align: center;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 30px;
      font-weight: 500;
      color: #000000;
      margin-bottom: 26px;
    }
    .input-gray {
      width: 100%;
      background: var(--gray-box);
      border: none;
      border-radius: 14px;
      padding: 16px 18px;
      font-size: 14px;
      color: #1f2937;
      margin-bottom: 18px;
      outline: none;
    }
    .input-gray::placeholder { color: #374151; }
    .auth-footer {
      text-align: center;
      font-size: 12.5px;
      margin-top: 20px;
      color: #000000;
      font-weight: 500;
    }
    .auth-footer span {
      color: #16365D;
      font-weight: 600;
      cursor: pointer;
    }

    /* Header Halaman Utama */
    .app-header {
      background: var(--navy);
      color: #ffffff;
      padding: 28px 24px 24px;
      flex-shrink: 0;
    }
    .app-header-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .app-header-top h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .app-header p {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      line-height: 1.4;
      text-transform: uppercase;
    }

    /* Area Konten Scrollable */
    .app-body {
      flex: 1;
      overflow-y: auto;
      padding: 22px 22px 96px;
      background: #ffffff;
    }
    .app-body::-webkit-scrollbar { width: 4px; }
    .app-body::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* Beranda - Kartu Lab */
    .lab-card { margin-bottom: 22px; }
    .lab-img {
      width: 100%;
      height: 165px;
      border-radius: 16px;
      object-fit: cover;
      display: block;
      margin-bottom: 12px;
      background: #e2e8f0;
    }

    /* Form Booking Abu-abu */
    .booking-box {
      background: var(--gray-box);
      border-radius: 22px;
      padding: 20px 20px 14px;
      margin-bottom: 18px;
    }
    .booking-box-header {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
      position: relative;
    }
    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
    }
    .booking-box-header h3 {
      flex: 1;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: #000000;
      margin-right: 28px;
    }
    .input-white {
      width: 100%;
      background: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 15px 16px;
      font-size: 13.5px;
      color: #111827;
      margin-bottom: 16px;
      outline: none;
    }
    .input-white::placeholder { color: #111827; opacity: 0.85; }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Layar Hasil Booking */
    .result-box {
      border-radius: 22px;
      height: 310px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      text-align: center;
      padding: 24px;
      margin-bottom: 22px;
    }
    .result-navy { background: var(--navy); }
    .result-red { background: #F52216; }
    .result-box p {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      margin-top: 14px;
    }

    /* Kalender Jadwal */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 14px;
      border-bottom: 1.5px solid #16365D;
      margin-bottom: 16px;
      color: #16365D;
      font-weight: 700;
      font-size: 16px;
    }
    .cal-arrow {
      cursor: pointer;
      font-size: 20px;
      font-weight: 800;
      user-select: none;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      row-gap: 12px;
      column-gap: 4px;
      font-size: 13px;
      margin-bottom: 22px;
    }
    .cal-day-name {
      font-weight: 700;
      color: #111827;
      padding-bottom: 4px;
    }
    .cal-date {
      width: 36px;
      height: 34px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
      color: #111827;
    }
    .cal-date.muted { color: #6b7280; font-weight: 600; }
    .cal-date.selected {
      border: 1.5px solid #111827;
      background: #ffffff;
    }

    /* Kartu List Abu-abu */
    .gray-card {
      background: var(--gray-box);
      border-radius: 18px;
      padding: 15px 18px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .gray-card-text h4 {
      font-size: 13px;
      font-weight: 700;
      color: #16365D;
      margin-bottom: 3px;
    }
    .gray-card-text p {
      font-size: 12.5px;
      font-weight: 700;
      color: #16365D;
      line-height: 1.35;
    }
    .gray-card-empty {
      background: var(--gray-box);
      border-radius: 18px;
      padding: 32px 18px;
      text-align: center;
      color: #16365D;
      font-size: 13.5px;
      font-weight: 700;
    }
    .status-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-green { background: var(--green-dot); }
    .dot-orange { background: var(--orange-dot); }

    /* Dashboard Admin 2x2 */
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 6px;
    }
    .stat-tile {
      background: var(--sky);
      color: #ffffff;
      border-radius: 20px;
      padding: 26px 14px 22px;
      text-align: center;
    }
    .stat-number {
      font-size: 32px;
      font-weight: 800;
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.85);
      width: 75%;
      margin-left: auto;
      margin-right: auto;
    }
    .stat-label {
      font-size: 13px;
      font-weight: 700;
    }

    /* Profil Editable */
    .avatar-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3.5px solid #000000;
      margin: 4px auto 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .profile-input-group {
      background: var(--gray-box);
      border-radius: 16px;
      padding: 10px 16px;
      margin-bottom: 14px;
      display: flex;
      flex-direction: column;
    }
    .profile-input-group label {
      font-size: 10.5px;
      font-weight: 700;
      color: #4b5563;
      margin-bottom: 2px;
    }
    .profile-input-group input {
      background: transparent;
      border: none;
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      outline: none;
      width: 100
