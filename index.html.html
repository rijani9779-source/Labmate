<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LabMate - Sistem Informasi Jadwal & Peminjaman Laboratorium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* Frame Mobile Persis Rasio Figma (412 x 860) */
    .phone-frame {
      width: 100%;
      max-width: 412px;
      height: 850px;
      background: #ffffff;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      display: flex;
      flex-direction: column;
      position: relative;
      border: 6px solid #1e293b;
    }

    /* Palet Warna Exact dari Screenshot */
    :root {
      --navy: #16365D;
      --sky: #55A6EB;
      --sky-hover: #4293d8;
      --gray-box: #D9D9D9;
      --red-btn: #FF0000;
      --green-dot: #38E516;
      --orange-dot: #E59B50;
    }

    .btn-sky {
      background: var(--sky);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 14px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      transition: 0.18s ease;
      letter-spacing: 0.2px;
    }
    .btn-sky:hover { background: var(--sky-hover); }

    .btn-red {
      background: var(--red-btn);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 14px;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
    }

    /* Layar Auth (Splash, Login, Buat Akun, Masuk Sebagai, Kode Admin) */
    .auth-screen {
      flex: 1;
      background: var(--navy);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
    }
    .auth-brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .auth-brand-row h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .auth-card {
      background: #ffffff;
      color: #111827;
      width: 100%;
      border-radius: 26px;
      padding: 32px 24px 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    .auth-card h2 {
      text-align: center;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 30px;
      font-weight: 500;
      color: #000000;
      margin-bottom: 26px;
    }
    .input-gray {
      width: 100%;
      background: var(--gray-box);
      border: none;
      border-radius: 14px;
      padding: 16px 18px;
      font-size: 14px;
      color: #1f2937;
      margin-bottom: 18px;
      outline: none;
    }
    .input-gray::placeholder { color: #374151; }
    .auth-footer {
      text-align: center;
      font-size: 12.5px;
      margin-top: 20px;
      color: #000000;
      font-weight: 500;
    }
    .auth-footer span {
      color: #16365D;
      font-weight: 600;
      cursor: pointer;
    }

    /* Header Biru Dongker Halaman Utama */
    .app-header {
      background: var(--navy);
      color: #ffffff;
      padding: 28px 24px 24px;
      flex-shrink: 0;
    }
    .app-header-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .app-header-top h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .app-header p {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.3px;
      line-height: 1.4;
      text-transform: uppercase;
    }

    /* Area Konten Scrollable */
    .app-body {
      flex: 1;
      overflow-y: auto;
      padding: 22px 22px 96px;
      background: #ffffff;
    }
    .app-body::-webkit-scrollbar { width: 4px; }
    .app-body::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    /* Beranda - Kartu Lab */
    .lab-card { margin-bottom: 22px; }
    .lab-img {
      width: 100%;
      height: 165px;
      border-radius: 16px;
      object-fit: cover;
      display: block;
      margin-bottom: 12px;
      background: #e2e8f0;
    }

    /* Form Booking Abu-abu Persis Desain */
    .booking-box {
      background: var(--gray-box);
      border-radius: 22px;
      padding: 20px 20px 14px;
      margin-bottom: 18px;
    }
    .booking-box-header {
      display: flex;
      align-items: center;
      margin-bottom: 18px;
      position: relative;
    }
    .back-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 2px;
    }
    .booking-box-header h3 {
      flex: 1;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: #000000;
      margin-right: 28px;
    }
    .input-white {
      width: 100%;
      background: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 15px 16px;
      font-size: 13.5px;
      color: #111827;
      margin-bottom: 16px;
      outline: none;
    }
    .input-white::placeholder { color: #111827; opacity: 0.85; }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Layar Hasil Booking (Navy untuk Berhasil, Merah untuk Gagal) */
    .result-box {
      border-radius: 22px;
      height: 310px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #ffffff;
      text-align: center;
      padding: 24px;
      margin-bottom: 22px;
    }
    .result-navy { background: var(--navy); }
    .result-red { background: #F52216; }
    .result-box p {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.45;
      margin-top: 14px;
    }

    /* Kalender Jadwal Persis Screenshot */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 4px 14px;
      border-bottom: 1.5px solid #16365D;
      margin-bottom: 16px;
      color: #16365D;
      font-weight: 700;
      font-size: 16px;
    }
    .cal-arrow {
      cursor: pointer;
      font-size: 20px;
      font-weight: 800;
      user-select: none;
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      row-gap: 12px;
      column-gap: 4px;
      font-size: 13px;
      margin-bottom: 22px;
    }
    .cal-day-name {
      font-weight: 700;
      color: #111827;
      padding-bottom: 4px;
    }
    .cal-date {
      width: 36px;
      height: 34px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
      color: #111827;
    }
    .cal-date.muted { color: #6b7280; font-weight: 600; }
    .cal-date.selected {
      border: 1.5px solid #111827;
      background: #ffffff;
    }

    /* Kartu List Abu-abu (Jadwal, Riwayat, Pengajuan) */
    .gray-card {
      background: var(--gray-box);
      border-radius: 18px;
      padding: 15px 18px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .gray-card-text h4 {
      font-size: 13px;
      font-weight: 700;
      color: #16365D;
      margin-bottom: 3px;
    }
    .gray-card-text p {
      font-size: 12.5px;
      font-weight: 700;
      color: #16365D;
      line-height: 1.35;
    }
    .gray-card-empty {
      background: var(--gray-box);
      border-radius: 18px;
      padding: 32px 18px;
      text-align: center;
      color: #16365D;
      font-size: 13.5px;
      font-weight: 700;
    }
    .status-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-green { background: var(--green-dot); }
    .dot-orange { background: var(--orange-dot); }

    /* Dashboard Admin 2x2 */
    .admin-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 6px;
    }
    .stat-tile {
      background: var(--sky);
      color: #ffffff;
      border-radius: 20px;
      padding: 26px 14px 22px;
      text-align: center;
    }
    .stat-number {
      font-size: 32px;
      font-weight: 800;
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 1.5px solid rgba(255, 255, 255, 0.85);
      width: 75%;
      margin-left: auto;
      margin-right: auto;
    }
    .stat-label {
      font-size: 13px;
      font-weight: 700;
    }

    /* Profil */
    .avatar-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3.5px solid #000000;
      margin: 4px auto 22px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .profile-box {
      background: var(--gray-box);
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 13.5px;
      font-weight: 500;
      color: #111827;
      margin-bottom: 16px;
    }

    /* Bottom Navigation Bar Kapsul Navy */
    .bottom-nav {
      position: absolute;
      bottom: 20px;
      left: 22px;
      right: 22px;
      background: var(--navy);
      border-radius: 22px;
      height: 58px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
      box-shadow: 0 8px 20px rgba(22, 54, 93, 0.3);
    }
    .nav-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 14px;
      opacity: 0.85;
      transition: 0.15s;
    }
    .nav-btn.active {
      opacity: 1;
      transform: scale(1.08);
    }
  </style>
</head>
<body>

<div class="phone-frame" id="app"></div>

<script>
  // Logo LabMate Custom SVG (Kalender + Labu Erlenmeyer + Jam + Orbit Biru)
  const labMateLogo = (w = 56) => `
    <svg width="${w}" height="${Math.round(w * 0.85)}" viewBox="0 0 90 76" fill="none">
      <!-- Orbit biru muda -->
      <path d="M12 56C4 46 18 26 44 16C68 7 84 12 80 24C77 33 60 46 36 55C22 60 15 60 12 56Z" stroke="#55A6EB" stroke-width="3" fill="none"/>
      <!-- Kalender -->
      <rect x="24" y="8" width="42" height="36" rx="5" fill="#16365D" stroke="#55A6EB" stroke-width="2.5"/>
      <path d="M24 18H66" stroke="#55A6EB" stroke-width="2.5"/>
      <rect x="31" y="4" width="4" height="8" rx="2" fill="#55A6EB"/>
      <rect x="55" y="4" width="4" height="8" rx="2" fill="#55A6EB"/>
      <!-- Grid Kalender -->
      <rect x="31" y="23" width="6" height="5" rx="1" fill="#ffffff"/>
      <rect x="41" y="23" width="6" height="5" rx="1" fill="#ffffff"/>
      <rect x="51" y="23" width="6" height="5" rx="1" fill="#55A6EB"/>
      <rect x="41" y="31" width="6" height="5" rx="1" fill="#ffffff"/>
      <rect x="51" y="31" width="6" height="5" rx="1" fill="#ffffff"/>
      <!-- Labu Erlenmeyer -->
      <path d="M23 26H31V35L39 54C40 56.5 38.2 59 35.5 59H18.5C15.8 59 14 56.5 15 54L23 35V26Z" fill="#ffffff" stroke="#16365D" stroke-width="2.5"/>
      <path d="M18 49L21 42H33L36 49C36.6 50.5 35.5 52 33.8 52H20.2C18.5 52 17.4 50.5 18 49Z" fill="#55A6EB"/>
      <rect x="21" y="23" width="12" height="3.5" rx="1.5" fill="#ffffff" stroke="#16365D" stroke-width="1.5"/>
      <!-- Jam -->
      <circle cx="58" cy="52" r="12" fill="#ffffff" stroke="#16365D" stroke-width="2.5"/>
      <path d="M58 45V52L63 55" stroke="#16365D" stroke-width="2.5" stroke-linecap="round"/>
    </svg>`;

  // Data Awal Persis dengan Screenshot Figma
  let bookings = JSON.parse(localStorage.getItem("labmate_v2")) || [
    {
      id: 1,
      nama: "Emilidia Yanti",
      nim: "2210131220011",
      kelas: "A6",
      jurusan: "Pendidikan Komputer",
      lab: "Lab 1",
      labFull: "Lab. Komputer 1",
      tanggal: "2026-11-20",
      jamMulai: "15.30",
      jamSelesai: "17.45",
      peserta: 30,
      keperluan: "Praktikum",
      status: "Menunggu"
    },
    {
      id: 2,
      nama: "Rahmaniah",
      nim: "2210131220018",
      kelas: "A6",
      jurusan: "Pendidikan Komputer",
      lab: "Lab 2",
      labFull: "Lab Komputer 2",
      tanggal: "2026-11-19",
      jamMulai: "13.00",
      jamSelesai: "15.30",
      peserta: 28,
      keperluan: "Praktikum",
      status: "Disetujui"
    },
    {
      id: 3,
      nama: "Sahidil Hifni",
      nim: "2210131210009",
      kelas: "A7",
      jurusan: "Pendidikan Komputer",
      lab: "Lab 1",
      labFull: "Lab Komputer 1",
      tanggal: "2026-11-20",
      jamMulai: "07.00",
      jamSelesai: "09.30",
      peserta: 32,
      keperluan: "Praktikum",
      status: "Disetujui"
    },
    {
      id: 4,
      nama: "Muhammad Rizky",
      nim: "2210131210021",
      kelas: "A5",
      jurusan: "Pendidikan Komputer",
      lab: "Lab 2",
      labFull: "Lab Komputer 2",
      tanggal: "2026-11-20",
      jamMulai: "11.00",
      jamSelesai: "12.45",
      peserta: 25,
      keperluan: "Penelitian",
      status: "Disetujui"
    }
  ];

  let state = {
    screen: "splash", // splash, login, register, roleSelect, adminCode, main
    role: "Mahasiswa", // Mahasiswa, Dosen, Admin
    tab: "home", // home, jadwal, riwayat, profil
    bookingStep: 0, // 0: beranda lab, 1: isi data diri, 2: detail, 3: berhasil, 4: gagal
    selectedLab: "Lab 1",
    selectedLabFull: "Lab. Komputer 1",
    selectedDate: 20,
    selectedAdminItem: null,
    tempBooking: {},
    user: { nama: "Ahmad Fauzi", id: "2210131210005", jurusan: "Pendidikan Komputer" }
  };

  function saveBookings() {
    localStorage.setItem("labmate_v2", JSON.stringify(bookings));
  }

  function go(screen, extra = {}) {
    state = { ...state, screen, ...extra };
    render();
  }

  function render() {
    const app = document.getElementById("app");

    // 1. MULAI / SPLASH SCREEN
    if (state.screen === "splash") {
      app.innerHTML = `
        <div class="auth-screen" style="cursor:pointer;" onclick="go('login')">
          <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
            ${labMateLogo(105)}
            <h1 style="font-size:34px; font-weight:800;">LabMate</h1>
            <p style="font-size:12px; opacity:0.75; margin-top:18px;">Ketuk layar untuk mulai</p>
          </div>
        </div>`;
      return;
    }

    // 2. HALAMAN LOGIN
    if (state.screen === "login") {
      app.innerHTML = `
        <div class="auth-screen">
          <div class="auth-brand-row">
            ${labMateLogo(64)}
            <h1>LabMate</h1>
          </div>
          <div class="auth-card">
            <h2>Login</h2>
            <input type="email" id="loginEmail" class="input-gray" placeholder="Email" />
            <input type="password" id="loginPass" class="input-gray" placeholder="Password" />
            <button class="btn-sky" style="margin-top:4px;" onclick="go('roleSelect')">Masuk</button>
            <div class="auth-footer">Belum Punya Akun? <span onclick="go('register')">Buat Baru</span></div>
          </div>
        </div>`;
      return;
    }

    // 3. HALAMAN BUAT AKUN
    if (state.screen === "register") {
      app.innerHTML = `
        <div class="auth-screen">
          <div class="auth-brand-row">
            ${labMateLogo(64)}
            <h1>LabMate</h1>
          </div>
          <div class="auth-card">
            <h2>Buat Akun</h2>
            <input type="email" class="input-gray" placeholder="Email" />
            <input type="password" class="input-gray" placeholder="Buat Password" />
            <button class="btn-sky" style="margin-top:4px;" onclick="go('roleSelect')">Buat Akun</button>
            <div class="auth-footer">Sudah Punya Akun? <span onclick="go('login')">Masuk</span></div>
          </div>
        </div>`;
      return;
    }

    // 4. MASUK SEBAGAI
    if (state.screen === "roleSelect") {
      app.innerHTML = `
        <div class="auth-screen">
          <div class="auth-brand-row">
            ${labMateLogo(64)}
            <h1>LabMate</h1>
          </div>
          <div class="auth-card">
            <h2>Masuk Sebagai</h2>
            <button class="btn-sky" style="margin-bottom:16px;" onclick="pilihRole('Mahasiswa')">Mahasiswa</button>
            <button class="btn-sky" style="margin-bottom:16px;" onclick="pilihRole('Dosen')">Dosen</button>
            <button class="btn-sky" onclick="go('adminCode')">Admin</button>
          </div>
        </div>`;
      return;
    }

    // 5. KODE AKSES ADMIN
    if (state.screen === "adminCode") {
      app.innerHTML = `
        <div class="auth-screen">
          <div class="auth-brand-row">
            ${labMateLogo(64)}
            <h1>LabMate</h1>
          </div>
          <div class="auth-card">
            <h2>Kode Admin</h2>
            <input type="password" id="kodeAdminInput" class="input-gray" placeholder="Kode Akses Admin" />
            <button class="btn-sky" style="margin-top:4px;" onclick="verifikasiAdmin()">Masuk</button>
            <div class="auth-footer"><span onclick="go('roleSelect')">Kembali</span></div>
          </div>
        </div>`;
      return;
    }

    // 6. HALAMAN UTAMA
    const isAdmin = state.role === "Admin";
    let headerTitle = "Beranda";
    if (state.tab === "home") {
      headerTitle = isAdmin ? "Dashboard" : (state.bookingStep > 0 ? "Booking Lab" : "Beranda");
    } else if (state.tab === "jadwal") {
      headerTitle = "Jadwal";
    } else if (state.tab === "riwayat") {
      headerTitle = isAdmin ? "Pengajuan" : "Riwayat";
    } else if (state.tab === "profil") {
      headerTitle = "Profile";
    }

    app.innerHTML = `
      <div class="app-header">
        <div class="app-header-top">
          ${labMateLogo(56)}
          <h1>${headerTitle}</h1>
        </div>
        <p>SISTEM INFORMASI JADWAL<br>DAN PEMINJAMAN LABORATORIUM</p>
      </div>
      <div class="app-body">${renderBody()}</div>
      ${renderBottomNav()}
    `;
  }

  function pilihRole(role) {
    state.role = role;
    state.user = role === "Dosen"
      ? { nama: "Bambang Abdi Setiawan, S.Kom., M.Kom.", id: "198805142015041001", jurusan: "Pendidikan Komputer" }
      : { nama: "Ahmad Fauzi", id: "2210131210005", jurusan: "Pendidikan Komputer" };
    go("main", { tab: "home", bookingStep: 0 });
  }

  function verifikasiAdmin() {
    const val = document.getElementById("kodeAdminInput").value.trim();
    if (val === "ADMIN123" || val === "") {
      state.role = "Admin";
      state.user = { nama: "Hendra Wijaya, S.Kom.", id: "ADM-01", jurusan: "Admin Laboratorium" };
      go("main", { tab: "home", selectedAdminItem: null });
    } else {
      alert("Kode Akses Admin salah! Gunakan: ADMIN123");
    }
  }

  function renderBody() {
    const isAdmin = state.role === "Admin";

    // --- TAB 1: BERANDA / DASHBOARD ---
    if (state.tab === "home") {
      if (isAdmin) {
        const menunggu = bookings.filter(b => b.status === "Menunggu").length;
        const disetujui = bookings.filter(b => b.status === "Disetujui").length;
        return `
          <div class="admin-grid">
            <div class="stat-tile">
              <div class="stat-number">2</div>
              <div class="stat-label">Jumlah Lab</div>
            </div>
            <div class="stat-tile">
              <div class="stat-number">11</div>
              <div class="stat-label">Jumlah Kelas</div>
            </div>
            <div class="stat-tile">
              <div class="stat-number">${menunggu}</div>
              <div class="stat-label">Menunggu</div>
            </div>
            <div class="stat-tile">
              <div class="stat-number">${disetujui}</div>
              <div class="stat-label">Disetujui</div>
            </div>
          </div>`;
      }

      // Beranda Mahasiswa/Dosen (Step 0)
      if (state.bookingStep === 0) {
        return `
          <div class="lab-card">
            <img class="lab-img" src="https://images.unsplash.com/photo-1517694712202-14dd9538aa97?auto=format&fit=crop&w=800&q=80" alt="Lab Komputer 1" />
            <button class="btn-sky" onclick="mulaiBooking('Lab 1', 'Lab Komputer 1')">BOOKING LAB. KOMPUTER 1</button>
          </div>
          <div class="lab-card">
            <img class="lab-img" src="https://images.unsplash.com/photo-1531482615713-2afd69097998?auto=format&fit=crop&w=800&q=80" alt="Lab Komputer 2" />
            <button class="btn-sky" onclick="mulaiBooking('Lab 2', 'Lab Komputer 2')">BOOKING LAB. KOMPUTER 2</button>
          </div>`;
      }

      // Isi Data Diri (Step 1)
      if (state.bookingStep === 1) {
        return `
          <div class="booking-box">
            <div class="booking-box-header">
              <button class="back-btn" onclick="go('main', {bookingStep: 0})">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="#55A6EB">
                  <path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/>
                </svg>
              </button>
              <h3>ISI DATA DIRI</h3>
            </div>
            <input type="text" id="bNama" class="input-white" placeholder="Nama" />
            <input type="text" id="bNim" class="input-white" placeholder="${state.role === 'Dosen' ? 'NIP' : 'NIM'}" />
            <input type="text" id="bKelas" class="input-white" placeholder="Kelas" />
            <input type="text" id="bJurusan" class="input-white" placeholder="Jurusan" />
          </div>
          <button class="btn-sky" onclick="lanjutDetail()">BOOKING SEKARANG</button>`;
      }

      // Detail Booking (Step 2)
      if (state.bookingStep === 2) {
        return `
          <div class="booking-box">
            <div class="booking-box-header">
              <button class="back-btn" onclick="go('main', {bookingStep: 1})">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="#55A6EB">
                  <path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z"/>
                </svg>
              </button>
              <h3>DETAIL</h3>
            </div>
            <input type="text" id="bKeperluan" class="input-white" placeholder="Isi Keperluan" />
            <input type="text" id="bTanggal" class="input-white" placeholder="Tanggal/Bulan (Contoh: 20/11/2026)" onfocus="(this.type='date')" />
            <div class="row-2">
              <input type="text" id="bMulai" class="input-white" placeholder="Jam Mulai" />
              <input type="text" id="bSelesai" class="input-white" placeholder="Jam Selesai" />
            </div>
            <input type="number" id="bPeserta" class="input-white" placeholder="Jumlah Peserta" />
          </div>
          <button class="btn-sky" onclick="prosesBooking()">BOOKING SEKARANG</button>`;
      }

      // Booking Berhasil (Step 3 - Kotak Navy Persis Screenshot!)
      if (state.bookingStep === 3) {
        return `
          <div class="result-box result-navy">
            <svg width="78" height="78" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2.5"/>
              <path d="M8 21h8M12 17v4"/>
              <path d="M8.5 10.5l2.5 2.5 5-5"/>
            </svg>
            <p>Lab Berhasil Dibooking<br>Menunggu Persetujuan</p>
          </div>
          <button class="btn-sky" onclick="go('main', {bookingStep: 0})">Kembali Ke Beranda</button>`;
      }

      // Booking Gagal / Bentrok (Step 4)
      if (state.bookingStep === 4) {
        return `
          <div class="result-box result-red">
            <svg width="78" height="78" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2.5"/>
              <path d="M8 21h8M12 17v4"/>
              <path d="M9.5 8l5 5M14.5 8l-5 5"/>
            </svg>
            <p>Peminjaman Gagal Atau Ditolak</p>
          </div>
          <button class="btn-sky" onclick="go('main', {bookingStep: 0})">Kembali Ke Beranda</button>`;
      }
    }

    // --- TAB 2: JADWAL (KALENDER NOVEMBER, 2026) ---
    if (state.tab === "jadwal") {
      const days = ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"];
      const tglKey = `2026-11-${String(state.selectedDate).padStart(2, '0')}`;
      const listHariIni = bookings.filter(b => b.tanggal === tglKey && b.status === "Disetujui");

      let gridDates = "";
      for (let d = 1; d <= 30; d++) {
        gridDates += `<div class="cal-date ${state.selectedDate === d ? 'selected' : ''}" onclick="go('main', {selectedDate: ${d}})">${d}</div>`;
      }
      for (let nxt = 1; nxt <= 5; nxt++) {
        gridDates += `<div class="cal-date muted">${nxt}</div>`;
      }

      return `
        <div class="cal-header">
          <span class="cal-arrow" onclick="geserTanggal(-1)">←</span>
          <span>November, 2026</span>
          <span class="cal-arrow" onclick="geserTanggal(1)">→</span>
        </div>
        <div class="cal-grid">
          ${days.map(d => `<div class="cal-day-name">${d}</div>`).join("")}
          ${gridDates}
        </div>
        ${listHariIni.length === 0
          ? `<div class="gray-card-empty">Tidak Ada Jadwal Hari Ini</div>`
          : listHariIni.map((item, idx) => `
              <div class="gray-card">
                <div class="gray-card-text">
                  <h4>${item.lab}</h4>
                  <p>${idx === 0 ? 'Sedang Digunakan' : 'Akan Digunakan'} (${item.jamMulai}-${item.jamSelesai})<br>oleh ${item.kelas}</p>
                </div>
                <span class="status-dot ${idx === 0 ? 'dot-green' : 'dot-orange'}"></span>
              </div>`).join("")
        }`;
    }

    // --- TAB 3: RIWAYAT (USER) / PENGAJUAN (ADMIN) ---
    if (state.tab === "riwayat") {
      if (!isAdmin) {
        return bookings.map(b => `
          <div class="gray-card">
            <div class="gray-card-text">
              <h4 style="color:#000000;">${b.labFull}</h4>
              <p style="color:#1f2937; font-weight:500;">${b.status === 'Disetujui' ? 'Selesai Digunakan' : b.status} untuk ${b.keperluan}<br>Pada ${formatTglIndo(b.tanggal)}, (${b.jamMulai} - ${b.jamSelesai})</p>
            </div>
          </div>`).join("");
      }

      // Admin Detail Pengajuan
      if (state.selectedAdminItem) {
        const it = state.selectedAdminItem;
        return `
          <div class="gray-card" style="flex-direction:column; align-items:stretch; padding:22px; cursor:default;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
              <h4 style="color:#000; font-size:15px;">${it.status === 'Menunggu' ? 'Menunggu Persetujuan' : (it.status === 'Disetujui' ? 'Telah Disetujui' : 'Ditolak')}</h4>
              <span class="status-dot ${it.status === 'Disetujui' ? 'dot-green' : 'dot-orange'}"></span>
            </div>
            <p style="color:#111827; font-size:13px; line-height:1.8; margin-bottom:18px; font-weight:500;">
              <strong>Nama:</strong> ${it.nama}<br>
              <strong>Kelas:</strong> ${it.kelas}<br>
              <strong>Laboratorium:</strong> ${it.labFull}<br>
              <strong>Tanggal:</strong> ${formatTglIndo(it.tanggal)}<br>
              <strong>Waktu:</strong> ${it.jamMulai} - ${it.jamSelesai}<br>
              <strong>Keperluan:</strong> ${it.keperluan} (${it.peserta} Peserta)
            </p>
            ${it.status === "Menunggu" ? `
              <div class="row-2" style="margin-bottom:10px;">
                <button class="btn-sky" style="background:#16a34a;" onclick="ubahStatusAdmin(${it.id}, 'Disetujui')">Setujui</button>
                <button class="btn-red" onclick="ubahStatusAdmin(${it.id}, 'Ditolak')">Tolak</button>
              </div>` : ''}
            <button class="btn-sky" onclick="go('main', {selectedAdminItem: null})">Kembali</button>
          </div>`;
      }

      // Admin List Pengajuan
      return bookings.map(b => `
        <div class="gray-card" onclick="bukaAdminItem(${b.id})">
          <div class="gray-card-text">
            <h4 style="color:#000000;">${b.status === 'Menunggu' ? 'Menunggu Persetujuan' : (b.status === 'Disetujui' ? 'Telah Disetujui' : 'Ditolak')}</h4>
            <p style="color:#1f2937; font-weight:500;">Dari ${b.nama}, Kelas ${b.kelas}<br>Pada ${formatTglIndo(b.tanggal)}, (${b.jamMulai}-${b.jamSelesai})</p>
          </div>
          <span class="status-dot ${b.status === 'Disetujui' ? 'dot-green' : 'dot-orange'}"></span>
        </div>`).join("");
    }

    // --- TAB 4: PROFIL ---
    if (state.tab === "profil") {
      return `
        <div class="avatar-wrap">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="#000000">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
        </div>
        <div class="profile-box">${isAdmin ? 'Nama Admin' : (state.role === 'Dosen' ? 'Nama Dosen' : 'Nama Mahasiswa')}: <strong>${state.user.nama}</strong></div>
        <div class="profile-box">${isAdmin ? 'ID Admin' : (state.role === 'Dosen' ? 'NIP' : 'NIM')}: <strong>${state.user.id}</strong></div>
        <div class="profile-box">${isAdmin ? 'Jabatan' : 'Jurusan'}: <strong>${state.user.jurusan}</strong></div>
        <button class="btn-red" style="margin-top:6px;" onclick="go('login')">Keluar</button>`;
    }
  }

  function renderBottomNav() {
    const isAdmin = state.role === "Admin";
    return `
      <div class="bottom-nav">
        <!-- Ikon Rumah -->
        <button class="nav-btn ${state.tab === 'home' ? 'active' : ''}" onclick="go('main', {tab:'home', bookingStep:0})">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
        </button>
        <!-- Ikon Kalender Jam -->
        <button class="nav-btn ${state.tab === 'jadwal' ? 'active' : ''}" onclick="go('main', {tab:'jadwal'})">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <rect x="3" y="4" width="16" height="16" rx="2.5"/>
            <path d="M15 2v4M7 2v4M3 9h16"/>
            <circle cx="17" cy="17" r="4.5" fill="#16365D" stroke="currentColor" stroke-width="1.8"/>
            <path d="M17 15v2l1.2 1"/>
          </svg>
        </button>
        <!-- Ikon Riwayat (User) / Clipboard (Admin) -->
        <button class="nav-btn ${state.tab === 'riwayat' ? 'active' : ''}" onclick="go('main', {tab:'riwayat', selectedAdminItem:null})">
          ${isAdmin
            ? `<svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
               </svg>`
            : `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/>
                <path d="M3 3v5h5"/>
                <path d="M12 7v5l3 2"/>
               </svg>`
          }
        </button>
        <!-- Ikon Profil -->
        <button class="nav-btn ${state.tab === 'profil' ? 'active' : ''}" onclick="go('main', {tab:'profil'})">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
          </svg>
        </button>
      </div>`;
  }

  // Helper & Logika Bisnis
  function formatTglIndo(iso) {
    if (!iso || !iso.includes("-")) return iso || "20/11/2026";
    const [y, m, d] = iso.split("-");
    return `${d}/${m}/${y}`;
  }

  function geserTanggal(delta) {
    let next = state.selectedDate + delta;
    if (next < 1) next = 30;
    if (next > 30) next = 1;
    go("main", { selectedDate: next });
  }

  function mulaiBooking(labShort, labFull) {
    go("main", { selectedLab: labShort, selectedLabFull: labFull, bookingStep: 1 });
  }

  function lanjutDetail() {
    state.tempBooking = {
      nama: document.getElementById("bNama").value.trim() || state.user.nama,
      nim: document.getElementById("bNim").value.trim() || state.user.id,
      kelas: document.getElementById("bKelas").value.trim() || "A6",
      jurusan: document.getElementById("bJurusan").value.trim() || state.user.jurusan
    };
    go("main", { bookingStep: 2 });
  }

  function prosesBooking() {
    const keperluan = document.getElementById("bKeperluan").value.trim() || "Praktikum";
    const tanggal = document.getElementById("bTanggal").value || "2026-11-20";
    const jamMulai = document.getElementById("bMulai").value.trim() || "08.00";
    const jamSelesai = document.getElementById("bSelesai").value.trim() || "10.00";
    const peserta = document.getElementById("bPeserta").value || 25;

    // Cek bentrok jadwal
    const bentrok = bookings.some(b =>
      b.lab === state.selectedLab &&
      b.tanggal === tanggal &&
      b.jamMulai === jamMulai &&
      b.status !== "Ditolak"
    );

    if (bentrok) {
      go("main", { bookingStep: 4 });
      return;
    }

    bookings.unshift({
      id: Date.now(),
      ...state.tempBooking,
      lab: state.selectedLab,
      labFull: state.selectedLabFull,
      tanggal,
      jamMulai,
      jamSelesai,
      peserta,
      keperluan,
      status: "Menunggu"
    });
    saveBookings();
    go("main", { bookingStep: 3 });
  }

  function bukaAdminItem(id) {
    const found = bookings.find(b => b.id === id);
    go("main", { selectedAdminItem: found });
  }

  function ubahStatusAdmin(id, statusBaru) {
    bookings = bookings.map(b => b.id === id ? { ...b, status: statusBaru } : b);
    saveBookings();
    go("main", { selectedAdminItem: null });
  }

  render();
</script>

</body>
</html>
